[package]
name = "taceo-oprf-node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Example TACEO:OPRF node binary, built reproducibly as OCI image and Nitro Enclave image."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["cryptography", "mpc", "oprf"]
publish = false

[package.metadata.cargo-machete]
ignored = ["humantime-serde"]

[[bin]]
name = "taceo-oprf-node"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
config = { workspace = true }
eyre.workspace = true
humantime-serde = { workspace = true }
nodes-common = { workspace = true, features = ["postgres", "serde"] }
oprf-client = { package = "taceo-oprf-client", path = "../oprf-client", version = "0.10" }
oprf-service = { package = "taceo-oprf-service", path = "../oprf-service", version = "0.19" }
oprf-types = { package = "taceo-oprf-types", path = "../oprf-types", version = "0.16" }
rustls = { workspace = true }
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
telemetry-batteries = { workspace = true, features = ["metrics-statsd"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
tracing.workspace = true
url = { workspace = true, features = ["serde"] }

[dev-dependencies]
rcgen = { workspace = true }
reqwest = { workspace = true }

[lints]
workspace = true
