name: Build EIF (oprf-node)

# See build-eif.yml. On a `oprf-node-v*` tag the verified EIF and its PCRs are
# published as a GitHub release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'oprf-node-v*'
  pull_request:
    paths:
      # Every input of the image: the binary's workspace crates (cargo tree
      # -p taceo-oprf-node), the lockfile, the build context and the workflows.
      - 'build/**'
      - 'oprf-enclave-launcher/**'
      - 'oprf-node/**'
      - 'oprf-service/**'
      - 'oprf-client/**'
      - 'oprf-core/**'
      - 'oprf-types/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.dockerignore'
      - '.github/workflows/build-eif.yml'
      - '.github/workflows/build-eif-oprf-node.yml'

permissions:
  contents: read

jobs:
  workflow:
    # A reusable workflow cannot exceed its caller's permissions; only its
    # release job uses contents: write.
    permissions:
      contents: write
    uses: ./.github/workflows/build-eif.yml
    with:
      image-name: oprf-node
      dockerfile: build/Dockerfile.oprf-node
