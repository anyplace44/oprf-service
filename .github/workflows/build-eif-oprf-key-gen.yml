name: Build EIF (oprf-key-gen)

# Reproducible AWS Nitro Enclave image: two independent runners build the
# `eif` target of build/Dockerfile.oprf-key-gen with no cache, the EIF and its
# PCRs must match byte for byte. The EIF stays a run artifact on branches and
# PRs; on an `oprf-key-gen-v*` tag the verified EIF and its PCRs are published
# as a GitHub release. linux/amd64 only.

on:
  workflow_dispatch:
  push:
    tags:
      - 'oprf-key-gen-v*'
  pull_request:
    paths:
      - 'build/**'
      - 'oprf-enclave-launcher/**'
      - '.github/workflows/build-eif-oprf-key-gen.yml'

permissions:
  contents: read

env:
  # Same pin as build-and-push.yml; bump both together.
  BUILDKIT_IMAGE: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

jobs:
  build:
    name: build (${{ matrix.builder }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - builder: primary
            runner: ubuntu-latest
          - builder: verify
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: lfs
        run: git lfs pull

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build EIF
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Dockerfile.oprf-key-gen
          target: eif
          platforms: linux/amd64
          provenance: false
          sbom: false
          no-cache: true
          build-args: |
            GIT_HASH=${{ github.sha }}
          outputs: type=local,dest=${{ runner.temp }}/eif

      - name: Upload EIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oprf-key-gen-eif-${{ matrix.builder }}
          path: ${{ runner.temp }}/eif
          if-no-files-found: error
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download EIFs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: oprf-key-gen-eif-*
          path: ${{ runner.temp }}/in

      - name: Verify both builders produced the same EIF
        shell: bash
        run: |
          cd "${{ runner.temp }}/in"
          sha256sum oprf-key-gen-eif-*/*
          if ! cmp oprf-key-gen-eif-primary/oprf-key-gen.pcrs oprf-key-gen-eif-verify/oprf-key-gen.pcrs \
            || ! cmp oprf-key-gen-eif-primary/oprf-key-gen.eif oprf-key-gen-eif-verify/oprf-key-gen.eif; then
            echo "::error::EIF is not reproducible across runners" >&2
            exit 1
          fi

      - name: Summary
        shell: bash
        run: |
          eif="${{ runner.temp }}/in/oprf-key-gen-eif-primary"
          {
            echo "### oprf-key-gen EIF"
            echo
            echo "Reproducible across two runners. sha256: \`$(sha256sum "$eif/oprf-key-gen.eif" | cut -d' ' -f1)\`"
            echo
            echo '```'
            cat "$eif/oprf-key-gen.pcrs"
            echo
            echo '```'
            echo
            echo "Rebuild from a checkout of \`${{ github.sha }}\` (with LFS files) with a builder on BuildKit \`$BUILDKIT_IMAGE\`:"
            echo
            echo '```sh'
            echo "docker buildx build --platform linux/amd64 --no-cache --build-arg GIT_HASH=${{ github.sha }} --target eif --output type=local,dest=out-eif -f build/Dockerfile.oprf-key-gen ."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/oprf-key-gen-v')
    needs:
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download primary EIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: oprf-key-gen-eif-primary
          path: ${{ runner.temp }}/eif

      - name: Create or update release
        shell: bash
        run: |
          cd "${{ runner.temp }}/eif"
          sha=$(sha256sum oprf-key-gen.eif | cut -d' ' -f1)
          kms=$(sed -n 's/^ARG KMS_KEY_ALIAS_ARN=//p' "$GITHUB_WORKSPACE/build/Dockerfile.oprf-key-gen")
          [ -n "$kms" ] || { echo "::error::KMS alias ARN not found in Dockerfile" >&2; exit 1; }
          pcr0=$(awk '$2=="PCR0"{print $1}' oprf-key-gen.pcrs)
          [[ "$pcr0" =~ ^[0-9a-f]{96}$ ]] || { echo "::error::no valid PCR0 in oprf-key-gen.pcrs" >&2; exit 1; }
          {
            echo "Reproducible Nitro Enclave image of oprf-key-gen, built on two independent runners with identical EIF and PCRs."
            echo
            echo "eif_sha256=$sha"
            echo "eif_pcr0=$pcr0"
            echo
            echo "- KMS alias the EIF trusts (build default): \`$kms\`"
            echo
            echo "The PCRs only hold for that KMS alias ARN. Full PCRs are in \`oprf-key-gen.pcrs\`."
          } > notes.md
          # Re-runs of the same tag replace the assets (the build is reproducible,
          # so they are identical) instead of failing on the existing release.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" oprf-key-gen.eif oprf-key-gen.pcrs --clobber
          else
            gh release create "$GITHUB_REF_NAME" oprf-key-gen.eif oprf-key-gen.pcrs \
              --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
