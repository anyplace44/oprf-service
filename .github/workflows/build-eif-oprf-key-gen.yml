name: Build EIF (oprf-key-gen)

# See build-eif.yml. Not released yet: the EIF stays a run artifact.

on:
  workflow_dispatch:
  push:
    tags:
      - 'oprf-key-gen-v*'
  pull_request:
    paths:
      - 'build/**'
      - 'oprf-enclave-launcher/**'
      - '.github/workflows/build-eif.yml'
      - '.github/workflows/build-eif-oprf-key-gen.yml'

permissions:
  contents: read

jobs:
  workflow:
    uses: ./.github/workflows/build-eif.yml
    with:
      image-name: oprf-key-gen
      dockerfile: build/Dockerfile.oprf-key-gen
      enclave-config: key-gen-example
