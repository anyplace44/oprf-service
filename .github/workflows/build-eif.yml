name: Build EIF

# Reproducible AWS Nitro Enclave image: two independent runners build the
# `eif` target of the given Dockerfile with no cache, the EIF and its PCRs
# must match byte for byte. Outside pull requests the verified EIF and its
# PCRs get a signed build provenance attestation (GitHub artifact
# attestations). The EIF stays a run artifact on branches and PRs; on an
# `<image-name>-v*` tag the attested EIF and its PCRs are published as a
# GitHub release. linux/amd64 only.

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Name of the EIF (eif_build --name) and of its files'
        required: true
        type: string
      dockerfile:
        description: 'Path to the Dockerfile with the `eif` target'
        required: true
        type: string

permissions:
  contents: read

env:
  # Same pin as build-and-push.yml; bump both together.
  BUILDKIT_IMAGE: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

jobs:
  build:
    name: build (${{ matrix.builder }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - builder: primary
            runner: ubuntu-latest
          - builder: verify
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: lfs
        run: git lfs pull

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build EIF
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: eif
          platforms: linux/amd64
          provenance: false
          sbom: false
          no-cache: true
          build-args: |
            GIT_HASH=${{ github.sha }}
          outputs: type=local,dest=${{ runner.temp }}/eif

      - name: Upload EIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.image-name }}-eif-${{ matrix.builder }}
          path: ${{ runner.temp }}/eif
          if-no-files-found: error
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    needs:
      - build
    env:
      NAME: ${{ inputs.image-name }}
      DOCKERFILE: ${{ inputs.dockerfile }}
    steps:
      - name: Download EIFs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.image-name }}-eif-*
          path: ${{ runner.temp }}/in

      - name: Verify both builders produced the same EIF
        shell: bash
        run: |
          cd "${{ runner.temp }}/in"
          sha256sum "$NAME"-eif-*/*
          if ! cmp "$NAME-eif-primary/$NAME.pcrs" "$NAME-eif-verify/$NAME.pcrs" \
            || ! cmp "$NAME-eif-primary/$NAME.eif" "$NAME-eif-verify/$NAME.eif"; then
            echo "::error::EIF is not reproducible across runners" >&2
            exit 1
          fi

      - name: Summary
        shell: bash
        run: |
          eif="${{ runner.temp }}/in/$NAME-eif-primary"
          {
            echo "### $NAME EIF"
            echo
            echo "Reproducible across two runners:"
            echo
            echo "| File | sha256 |"
            echo "| --- | --- |"
            echo "| \`$NAME.eif\` | \`$(sha256sum "$eif/$NAME.eif" | cut -d' ' -f1)\` |"
            echo "| \`$NAME.pcrs\` | \`$(sha256sum "$eif/$NAME.pcrs" | cut -d' ' -f1)\` |"
            echo
            echo "PCRs, the contents of \`$NAME.pcrs\`. The file is in this run's \`$NAME-eif-primary\` artifact, and in \`out-eif/$NAME.pcrs\` after a rebuild:"
            echo
            echo '```'
            cat "$eif/$NAME.pcrs"
            echo
            echo '```'
            echo
            echo "Rebuild from a checkout of \`${{ github.sha }}\` (with LFS files) with a builder on BuildKit \`$BUILDKIT_IMAGE\`, then compare the hashes and PCRs with the ones above:"
            echo
            echo '```sh'
            echo "docker buildx build --platform linux/amd64 --no-cache --build-arg GIT_HASH=${{ github.sha }} --target eif --output type=local,dest=out-eif -f $DOCKERFILE ."
            echo "sha256sum out-eif/*"
            echo "cat out-eif/$NAME.pcrs"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  attest:
    # Signs "these files were built by this workflow from this commit" with the
    # run's OIDC identity (Sigstore). The attestation lives in GitHub's
    # attestation store, the EIF and its PCRs are not modified. Pull requests
    # only prove reproducibility; fork PRs get no OIDC token anyway.
    if: github.event_name != 'pull_request'
    needs:
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate
      attestations: write
    env:
      NAME: ${{ inputs.image-name }}
    steps:
      - name: Download primary EIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.image-name }}-eif-primary
          path: ${{ runner.temp }}/eif

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/eif/${{ inputs.image-name }}.eif
            ${{ runner.temp }}/eif/${{ inputs.image-name }}.pcrs

      - name: Summary
        shell: bash
        run: |
          # The certificate names the workflow that ran the attest job, i.e.
          # this reusable workflow, not its caller.
          signer="${{ github.repository }}/.github/workflows/build-eif.yml"
          {
            echo "### $NAME EIF attestation"
            echo
            echo "Verify the build provenance of the EIF and of its PCRs file (from this run's \`$NAME-eif-primary\` artifact, the release, or a rebuild):"
            echo
            echo '```sh'
            echo "gh attestation verify $NAME.eif --repo ${{ github.repository }} --signer-workflow $signer"
            echo "gh attestation verify $NAME.pcrs --repo ${{ github.repository }} --signer-workflow $signer"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, format('refs/tags/{0}-v', inputs.image-name))
    # After attest, so a published release always has a provenance attestation.
    needs:
      - verify
      - attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NAME: ${{ inputs.image-name }}
    steps:
      - name: Download primary EIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.image-name }}-eif-primary
          path: ${{ runner.temp }}/eif

      - name: Create or update release
        shell: bash
        run: |
          cd "${{ runner.temp }}/eif"
          sha=$(sha256sum "$NAME.eif" | cut -d' ' -f1)
          pcr0=$(awk '$2=="PCR0"{print $1}' "$NAME.pcrs")
          [[ "$pcr0" =~ ^[0-9a-f]{96}$ ]] || { echo "::error::no valid PCR0 in $NAME.pcrs" >&2; exit 1; }
          {
            echo "Reproducible Nitro Enclave image of $NAME, built on two independent runners with identical EIF and PCRs."
            echo
            echo "eif_sha256=$sha"
            echo "eif_pcr0=$pcr0"
            echo
            echo "The EIF holds no account, region or key name. Full PCRs are in \`$NAME.pcrs\`."
            echo
            echo "Both files carry a signed build provenance attestation:"
            echo
            echo '```sh'
            echo "gh attestation verify $NAME.eif --repo $GH_REPO --signer-workflow $GH_REPO/.github/workflows/build-eif.yml"
            echo "gh attestation verify $NAME.pcrs --repo $GH_REPO --signer-workflow $GH_REPO/.github/workflows/build-eif.yml"
            echo '```'
          } > notes.md
          # Re-runs of the same tag replace the assets (the build is reproducible,
          # so they are identical) instead of failing on the existing release.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$NAME.eif" "$NAME.pcrs" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$NAME.eif" "$NAME.pcrs" \
              --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
