name: Build EIF

# Reproducible AWS Nitro Enclave image: two independent runners build the
# `eif` target of the given Dockerfile with no cache, the EIF and its PCRs
# must match byte for byte. The EIF is kept as a run artifact only; it is not
# released yet. linux/amd64 only.

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Name of the EIF (eif_build --name) and of its files'
        required: true
        type: string
      dockerfile:
        description: 'Path to the Dockerfile with the `eif` target'
        required: true
        type: string
      enclave-config:
        description: 'Directory under build/enclave/ with environment and forwards'
        required: true
        type: string

permissions:
  contents: read

env:
  # Same pin as build-and-push.yml; bump both together.
  BUILDKIT_IMAGE: moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
  ENCLAVE_CONFIG: ${{ inputs.enclave-config }}

jobs:
  build:
    name: build (${{ matrix.builder }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - builder: primary
            runner: ubuntu-latest
          - builder: verify
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: lfs
        run: git lfs pull

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build EIF
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: eif
          platforms: linux/amd64
          provenance: false
          sbom: false
          no-cache: true
          build-args: |
            GIT_HASH=${{ github.sha }}
            ENCLAVE_CONFIG=${{ env.ENCLAVE_CONFIG }}
          outputs: type=local,dest=${{ runner.temp }}/eif

      - name: Upload EIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.image-name }}-eif-${{ matrix.builder }}
          path: ${{ runner.temp }}/eif
          if-no-files-found: error
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download EIFs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.image-name }}-eif-*
          path: ${{ runner.temp }}/in

      - name: Verify both builders produced the same EIF
        shell: bash
        env:
          NAME: ${{ inputs.image-name }}
        run: |
          cd "${{ runner.temp }}/in"
          sha256sum "$NAME"-eif-*/*
          if ! cmp "$NAME-eif-primary/$NAME.pcrs" "$NAME-eif-verify/$NAME.pcrs" \
            || ! cmp "$NAME-eif-primary/$NAME.eif" "$NAME-eif-verify/$NAME.eif"; then
            echo "::error::EIF is not reproducible across runners" >&2
            exit 1
          fi

      - name: Summary
        shell: bash
        env:
          NAME: ${{ inputs.image-name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          eif="${{ runner.temp }}/in/$NAME-eif-primary"
          {
            echo "### $NAME EIF (config \`$ENCLAVE_CONFIG\`)"
            echo
            echo "Reproducible across two runners:"
            echo
            echo "| File | sha256 |"
            echo "| --- | --- |"
            echo "| \`$NAME.eif\` | \`$(sha256sum "$eif/$NAME.eif" | cut -d' ' -f1)\` |"
            echo "| \`$NAME.pcrs\` | \`$(sha256sum "$eif/$NAME.pcrs" | cut -d' ' -f1)\` |"
            echo
            echo "PCRs, the contents of \`$NAME.pcrs\`. The file is in this run's \`$NAME-eif-primary\` artifact, and in \`out-eif/$NAME.pcrs\` after a rebuild:"
            echo
            echo '```'
            cat "$eif/$NAME.pcrs"
            echo
            echo '```'
            echo
            echo "Rebuild from a checkout of \`${{ github.sha }}\` (with LFS files) with a builder on BuildKit \`$BUILDKIT_IMAGE\`, then compare the hashes and PCRs with the ones above:"
            echo
            echo '```sh'
            echo "docker buildx build --platform linux/amd64 --no-cache --build-arg GIT_HASH=${{ github.sha }} --build-arg ENCLAVE_CONFIG=$ENCLAVE_CONFIG --target eif --output type=local,dest=out-eif -f $DOCKERFILE ."
            echo "sha256sum out-eif/*"
            echo "cat out-eif/$NAME.pcrs"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
